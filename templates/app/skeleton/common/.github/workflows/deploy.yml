# Flux GitOps deployment — triggered by semver release tags.
# The Docker workflow builds and pushes the image on tag push,
# then Flux ImagePolicy picks up the new tag and reconciles.
#
# This workflow can notify Flux to reconcile immediately or
# perform additional deployment tasks (smoke tests, notifications).
name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "target=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          TARGET_ENV: ${{ steps.env.outputs.target }}
        run: |
          echo "Deploying ${GITHUB_REF_NAME:-manual} to ${TARGET_ENV}"
          echo "TODO — Add Flux reconciliation trigger or deployment steps"
