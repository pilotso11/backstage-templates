# Flux GitOps deployment — triggered by semver release tags.
# The Docker workflow builds and pushes the image on tag push,
# then this workflow triggers an immediate Flux reconciliation
# via the notification controller's webhook receiver.
#
# Required secrets:
#   FLUX_WEBHOOK_URL   — Full URL of the Flux Receiver endpoint
#                        (e.g. https://flux.example.com/hook/<receiver-hash>)
#   FLUX_WEBHOOK_TOKEN — Shared HMAC token configured in the Receiver resource
name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Trigger Flux Reconciliation
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
      WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
    steps:
      - name: Trigger Flux reconcile
        if: ${{ env.WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Flux reconciliation for ${GITHUB_REF_NAME:-manual}"
          curl -s -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=$(echo -n '' | openssl dgst -sha256 -hmac "${WEBHOOK_TOKEN}" | awk '{print $2}')" \
            -d '{}' \
            --fail --show-error
          echo "Flux reconciliation triggered"
