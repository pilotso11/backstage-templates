apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-scaffolder
  title: Full-Stack Application v0.0.42
  description: >
    Composable full-stack app with optional frontend (React/Lit/TypeScript + Vite + Tailwind + Bun)
    and backend (GoFiber + OpenAPI or FastAPI + OpenAPI). Multi-arch Docker, coverage badges,
    GitHub Actions CI, branch protection, and Claude Code task list support.
  tags:
    - go
    - python
    - react
    - lit
    - typescript
    - vite
    - tailwind
    - docker
spec:
  owner: user:seth
  type: service

  parameters:
    - title: Application Details
      required: [name, description]
      properties:
        name:
          title: Name
          type: string
          description: Repository name (also becomes CLAUDE_CODE_TASK_LIST_ID and Docker image name)
          pattern: "^[a-z0-9-]+$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the application

    - title: Stack Selection
      properties:
        frontend:
          title: Frontend
          type: string
          default: react
          enum: [none, react, lit, typescript]
          enumNames:
            - "None (backend only)"
            - "React + Tailwind"
            - "Lit + Tailwind"
            - "TypeScript + Tailwind"
        backend:
          title: Backend
          type: string
          default: gofiber
          enum: [none, gofiber, fastapi]
          enumNames:
            - "None (frontend-only SPA)"
            - "Go + GoFiber (OpenAPI via swaggo)"
            - "Python + FastAPI (OpenAPI built-in)"

    - title: Deployment
      properties:
        containerPort:
          title: Container Port
          type: number
          description: "Application container port (default: 8000)"
        enableSSO:
          title: Enable SSO
          type: boolean
          default: true
          description: >
            Enable Google OAuth2 Single Sign-On via oauth2-proxy.
            In development, simulated auth headers are used via DEV_USER_EMAIL env var.
        enableDatabase:
          title: Enable Database
          type: boolean
          default: false
          description: >
            Provision a CloudNativePG PostgreSQL database and enable the todo list feature.
            In local development, a PostgreSQL container is added to docker-compose.

  steps:
    - id: fetch-common
      name: Fetch common files
      action: fetch:template
      input:
        url: ./skeleton/common
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: pilotso11
          backstageUser: ${{ user.entity.metadata.name }}
          frontend: ${{ parameters.frontend }}
          backend: ${{ parameters.backend }}
          dockerhub_org: pilotso11
          enableSSO: ${{ parameters.enableSSO if parameters.enableSSO else false }}
          enableDatabase: ${{ parameters.enableDatabase if parameters.enableDatabase else false }}

    - id: fetch-frontend-react
      name: Fetch React frontend
      if: ${{ parameters.frontend === "react" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/react
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-frontend-lit
      name: Fetch Lit frontend
      if: ${{ parameters.frontend === "lit" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/lit
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-frontend-typescript
      name: Fetch TypeScript frontend
      if: ${{ parameters.frontend === "typescript" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/typescript
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-backend-gofiber
      name: Fetch GoFiber backend
      if: ${{ parameters.backend === "gofiber" }}
      action: fetch:template
      input:
        url: ./skeleton/backend/gofiber
        targetPath: backend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: pilotso11
          enableSSO: ${{ parameters.enableSSO if parameters.enableSSO else false }}
          enableDatabase: ${{ parameters.enableDatabase if parameters.enableDatabase else false }}

    - id: fetch-backend-fastapi
      name: Fetch FastAPI backend
      if: ${{ parameters.backend === "fastapi" }}
      action: fetch:template
      input:
        url: ./skeleton/backend/fastapi
        targetPath: backend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          enableSSO: ${{ parameters.enableSSO if parameters.enableSSO else false }}

    - id: strip-njk
      name: Strip .njk file extensions
      action: oshers:strip-njk
      input: {}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: "github.com?owner=pilotso11&repo=${{ parameters.name }}"
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main
        protectDefaultBranch: true


    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/pilotso11/${{ parameters.name }}/blob/main/catalog-info.yaml

    - id: register-with-flux
      name: Register with cluster (open PR)
      action: oshers:register-with-flux
      input:
        appName: ${{ parameters.name }}
        repoOwner: pilotso11
        dockerhubOrg: pilotso11
        containerPort: ${{ parameters.containerPort if parameters.containerPort else 8000 }}
        enableSSO: ${{ parameters.enableSSO if parameters.enableSSO else false }}
        enableDatabase: ${{ parameters.enableDatabase if parameters.enableDatabase else false }}
        githubToken: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        url: ${{ steps['register'].output.entityRef }}
      - title: Cluster registration PR
        url: ${{ steps['register-with-flux'].output.pullRequestUrl }}
