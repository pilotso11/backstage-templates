apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-scaffolder
  title: Full-Stack Application v0.0.26
  description: >
    Composable full-stack app with optional frontend (React/Lit/TypeScript + Vite + Tailwind + Bun)
    and backend (GoFiber + OpenAPI or FastAPI + OpenAPI). Multi-arch Docker, coverage badges,
    GitHub Actions CI, branch protection, and Claude Code task list support.
  tags:
    - go
    - python
    - react
    - lit
    - typescript
    - vite
    - tailwind
    - docker
spec:
  owner: user:seth
  type: service

  parameters:
    - title: Application Details
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Repository name (also becomes CLAUDE_CODE_TASK_LIST_ID and Docker image name)
          pattern: "^[a-z0-9-]+$"
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the application
        owner:
          title: GitHub Owner
          type: string
          description: >
            GitHub username or organization that will own the repo.
            IMPORTANT: Your GitHub token must have write permissions for this owner/org.
            For personal projects, use your GitHub username (e.g., "pilotso11").
            For company projects, ensure you have been granted repo creation permissions in the organization.

    - title: Stack Selection
      properties:
        frontend:
          title: Frontend
          type: string
          default: react
          enum: [none, react, lit, typescript]
          enumNames:
            - "None (backend only)"
            - "React + Tailwind"
            - "Lit + Tailwind"
            - "TypeScript + Tailwind"
        backend:
          title: Backend
          type: string
          default: gofiber
          enum: [none, gofiber, fastapi]
          enumNames:
            - "None (frontend-only SPA)"
            - "Go + GoFiber (OpenAPI via swaggo)"
            - "Python + FastAPI (OpenAPI built-in)"

    - title: Docker Hub
      properties:
        dockerhub_org:
          title: Docker Hub Org / Username
          type: string
          description: Docker Hub organization or username for image pushes
        containerPort:
          title: Container Port
          type: number
          description: "Application container port (default: 8000)"

  steps:
    - id: fetch-common
      name: Fetch common files
      action: fetch:template
      input:
        url: ./skeleton/common
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          backstageUser: ${{ user.entity.metadata.name }}
          frontend: ${{ parameters.frontend }}
          backend: ${{ parameters.backend }}
          dockerhub_org: ${{ parameters.dockerhub_org }}

    - id: fetch-frontend-react
      name: Fetch React frontend
      if: ${{ parameters.frontend === "react" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/react
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-frontend-lit
      name: Fetch Lit frontend
      if: ${{ parameters.frontend === "lit" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/lit
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-frontend-typescript
      name: Fetch TypeScript frontend
      if: ${{ parameters.frontend === "typescript" }}
      action: fetch:template
      input:
        url: ./skeleton/frontend/typescript
        targetPath: frontend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          backend: ${{ parameters.backend }}

    - id: fetch-backend-gofiber
      name: Fetch GoFiber backend
      if: ${{ parameters.backend === "gofiber" }}
      action: fetch:template
      input:
        url: ./skeleton/backend/gofiber
        targetPath: backend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: fetch-backend-fastapi
      name: Fetch FastAPI backend
      if: ${{ parameters.backend === "fastapi" }}
      action: fetch:template
      input:
        url: ./skeleton/backend/fastapi
        targetPath: backend
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: strip-njk
      name: Strip .njk file extensions
      action: oshers:strip-njk
      input: {}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: "github.com?owner=${{ parameters.owner }}&repo=${{ parameters.name }}"
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main
        protectDefaultBranch: true


    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        catalogInfoUrl: https://github.com/${{ parameters.owner }}/${{ parameters.name }}/blob/main/catalog-info.yaml

    - id: register-with-flux
      name: Register with cluster (open PR)
      action: oshers:register-with-flux
      input:
        appName: ${{ parameters.name }}
        repoOwner: ${{ parameters.owner }}
        dockerhubOrg: ${{ parameters.dockerhub_org }}
        containerPort: ${{ parameters.containerPort if parameters.containerPort else 8000 }}
        githubToken: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        url: ${{ steps['register'].output.entityRef }}
      - title: Cluster registration PR
        url: ${{ steps['register-with-flux'].output.pullRequestUrl }}
